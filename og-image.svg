<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#080808"/>
  <!-- gradient bg -->
  <radialGradient id="bg" cx="50%" cy="0%" r="80%">
    <stop offset="0%" stop-color="#ff5500" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo icon -->
  <text x="600" y="200" font-family="-apple-system, sans-serif" font-size="96" text-anchor="middle">🏋️</text>

  <!-- App name -->
  <text x="600" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="72" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-1">LiftNote</text>

  <!-- Tagline -->
  <text x="600" y="370" font-family="-apple-system, BlinkMacSystemFont, sans-serif"
        font-size="28" font-weight="600" text-anchor="middle" fill="#8a8a8e">テクノロジー×筋肉で習慣をハック</text>

  <!-- Features row -->
  <rect x="200" y="430" width="240" height="80" rx="14" fill="#131313" stroke="#242424" stroke-width="1"/>
  <text x="320" y="468" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#efefef" font-weight="700">💪 トレ記録</text>
  <text x="320" y="494" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#888">種目・セット・重量</text>

  <rect x="480" y="430" width="240" height="80" rx="14" fill="#131313" stroke="#242424" stroke-width="1"/>
  <text x="600" y="468" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#efefef" font-weight="700">📈 進捗グラフ</text>
  <text x="600" y="494" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#888">1RM・体重推移</text>

  <rect x="760" y="430" width="240" height="80" rx="14" fill="#131313" stroke="#242424" stroke-width="1"/>
  <text x="880" y="468" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#efefef" font-weight="700">🔥 習慣スコア</text>
  <text x="880" y="494" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#888">ストリーク・目標</text>
</svg>
